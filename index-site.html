<title>Port-Clair · Le casier 112</title>
<style>
/* Layout : une seule colonne de téléphone, centrée ; en haut l'état de la partie,
   au milieu l'image du lieu et la scène, en bas les actions. Un seul univers visuel
   (soir prune), tiré du portrait de la professeure : lilas de la blouse, ambre des lunettes. */
:root{
  color-scheme:dark;
  --nuit:#1c1326; --prune:#2a1c3a; --prune-2:#3b2a50; --trait:#52406b;
  --lilas:#b99de3; --ambre:#f3a85c; --creme:#f7ede0; --sourdine:#b5a6c6;
  --ok:#72d6a3; --non:#ff8f7c; --papier:#f4ead6; --encre:#2b2233;
  --titre:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --texte:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
}
html,body{height:100%}
body{background:var(--nuit);color:var(--creme);font-family:var(--texte);font-size:17px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
*{box-sizing:border-box}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--ambre);outline-offset:2px}
.app{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:16px;padding-block:16px}

/* Menu principal */
.accueil{display:flex;flex-direction:column;gap:18px}
.affiche{position:relative;border-radius:28px 28px 28px 6px;overflow:hidden;background:var(--prune)}
.affiche img{display:block;width:100%;aspect-ratio:16/10;object-fit:cover;object-position:50% 20%}
.affiche .bandeau{position:absolute;left:0;right:0;bottom:0;padding:48px 18px 14px;
  background:linear-gradient(to top,var(--nuit) 12%,transparent)}
.sur{font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ambre);font-weight:700;margin:0}
h1{font-family:var(--titre);font-weight:800;font-size:clamp(2.2rem,10vw,3rem);line-height:1;margin:.15em 0 0;text-wrap:balance}
.pitch{margin:0;color:var(--sourdine)}
.note{margin:0;color:var(--ok);font-size:.92rem}
.champ{display:flex;flex-direction:column;gap:8px}
.champ label,.champ .etq{font-weight:700;font-size:.95rem}
.champ input{background:var(--prune);border:2px solid var(--trait);border-radius:14px;padding:12px 14px;width:100%}
.langues{position:relative}
.langue-bouton{width:100%;display:flex;align-items:center;gap:10px;background:var(--prune);border:2px solid var(--trait);border-radius:14px;padding:11px 14px;text-align:left;font-weight:700}
.langue-bouton[aria-expanded="true"]{border-color:var(--lilas)}
.langue-bouton .fl{font-size:1.5rem;line-height:1}
.langue-bouton .nom{flex:1;min-width:0}
.langue-bouton .fleche{color:var(--lilas);transition:transform .15s}
.langue-bouton[aria-expanded="true"] .fleche{transform:rotate(180deg)}
.langue-liste{position:absolute;z-index:15;left:0;right:0;top:calc(100% + 6px);margin:0;padding:6px;list-style:none;background:var(--nuit);border:2px solid var(--lilas);border-radius:14px;max-height:min(52vh,380px);overflow:auto;box-shadow:0 12px 30px #0008}
.langue{display:flex;align-items:center;gap:12px;width:100%;padding:10px 10px;border-radius:10px;text-align:left;background:transparent;border:0;color:var(--creme);font:inherit}
.langue .fl{font-size:1.5rem;line-height:1}
.langue:hover,.langue:focus-visible{background:var(--prune-2)}
.langue[aria-selected="true"]{background:var(--lilas);color:var(--nuit);font-weight:700}
.episodes{display:flex;flex-direction:column;gap:12px}
.episode{background:var(--prune);border:2px solid var(--trait);border-radius:20px 20px 20px 6px;padding:14px;display:flex;flex-direction:column;gap:10px}
.episode h2{font-family:var(--titre);font-weight:800;font-size:1.35rem;margin:0;line-height:1.15}
.episode p{margin:0;color:var(--sourdine);font-size:.95rem}
.episode .statut{color:var(--creme);font-variant-numeric:tabular-nums}
.episode .statut b{color:var(--ambre)}

.btn{background:var(--ambre);color:var(--nuit);border:0;border-radius:16px;padding:14px 18px;font-family:var(--titre);
  font-weight:800;font-size:1.1rem;width:100%;box-shadow:0 4px 0 #b9712c}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #b9712c}
.btn:disabled{opacity:.45;cursor:default}
.btn.doux{background:var(--prune-2);color:var(--creme);box-shadow:0 4px 0 var(--nuit);border:2px solid var(--trait)}

/* Barre du haut */
.haut{display:flex;flex-direction:column;gap:10px}
.haut .ligne{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.lieu{font-family:var(--titre);font-weight:800;font-size:1.1rem;flex:1 1 120px;min-width:0;line-height:1.2}
.lieu small{display:block;font-family:var(--texte);font-weight:400;font-size:.8rem;color:var(--sourdine)}
.pastille{background:var(--prune);border:2px solid var(--trait);border-radius:999px;padding:6px 12px;font-size:.9rem;
  font-variant-numeric:tabular-nums;white-space:nowrap}
.pastille b{color:var(--ambre)}
.pastille.menu{border-color:var(--lilas);color:var(--lilas);font-weight:700}
.jauge{height:8px;border-radius:99px;background:var(--prune);overflow:hidden}
.jauge i{display:block;height:100%;width:0;background:var(--lilas);border-radius:99px;transition:width .4s}

/* Scène */
.scene{flex:1;display:flex;flex-direction:column;gap:14px}
.image{border-radius:22px 22px 22px 6px;overflow:hidden;border:3px solid var(--prune-2);background:var(--prune)}
.image svg{display:block;width:100%;height:auto}
.picto{display:flex;justify-content:center}
.picto svg{width:230px;height:auto;display:block}
.qui{display:flex;align-items:center;gap:10px}
.avatar{width:58px;height:58px;border-radius:50%;flex:none;display:grid;place-items:center;font-family:var(--titre);
  font-weight:800;font-size:1.4rem;color:var(--nuit);background:var(--lilas);overflow:hidden;border:3px solid var(--prune-2)}
.avatar img{width:100%;height:100%;object-fit:cover;object-position:50% 18%;transform:scale(1.55);transform-origin:50% 30%}
.avatar img.photo{transform:none;object-position:50% 50%}
.avatar.parle{border-color:var(--ambre);animation:parle 1.1s ease-in-out infinite}
@keyframes parle{50%{box-shadow:0 0 0 7px color-mix(in srgb,var(--ambre) 28%,transparent)}}
.qui .nom{font-family:var(--titre);font-weight:800}
.qui .role{font-size:.8rem;color:var(--sourdine);display:block;font-family:var(--texte);font-weight:400}
.bulle{background:var(--prune);border-radius:6px 22px 22px 22px;padding:16px 18px;margin:0;font-size:1.12rem;animation:entre .3s ease-out}
.bulle.recit{background:none;border-left:3px solid var(--trait);border-radius:0;font-style:italic;color:var(--sourdine);padding:4px 0 4px 14px}
@keyframes entre{from{transform:translateY(6px);opacity:.4}}
.mot{background:none;border:0;padding:0;border-bottom:2px dotted var(--ambre);color:var(--ambre);font-weight:700}
.outils{display:flex;gap:8px;flex-wrap:wrap}
.outil{background:none;border:2px solid var(--trait);border-radius:999px;padding:5px 12px;font-size:.88rem;color:var(--sourdine)}
.trad{margin:0;padding:10px 14px;border-radius:14px;background:var(--prune-2);color:var(--creme);font-size:1rem}
.tiroir{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--prune-2);border-radius:14px;padding:10px 14px}
.tiroir .fr{font-weight:700;color:var(--ambre)}
.tiroir .vers{font-size:1.1rem}
.tiroir .neuf{margin-left:auto;font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ok);font-weight:700}
.billet{background:var(--papier);color:var(--encre);padding:20px 18px;border-radius:4px;transform:rotate(-1.2deg);
  font-size:1.15rem;margin:6px 4px;box-shadow:0 10px 24px #0007}
.billet .mot{color:#8a4b12;border-color:#8a4b12}
.billet .signe{display:block;text-align:right;margin-top:8px;font-style:italic}
.actions{display:flex;flex-direction:column;gap:10px;margin-top:auto;padding-top:6px}
.choix{background:var(--prune);border:2px solid var(--trait);border-radius:16px;padding:13px 15px;text-align:left;width:100%}
.choix.bon{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 16%,var(--prune))}
.choix.faux{border-color:var(--non);opacity:.6}
.retour{display:flex;gap:10px;align-items:flex-start;background:var(--prune-2);border-radius:16px;padding:12px}
.retour .avatar{width:42px;height:42px;border-width:2px}
.retour p{margin:0;font-size:1rem}
.retour.ok{box-shadow:inset 4px 0 var(--ok)} .retour.non{box-shadow:inset 4px 0 var(--non)}

/* Mini-jeux */
.jeu-titre{font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--lilas);font-weight:700;margin:0}
.rang{display:flex;flex-wrap:wrap;gap:8px;min-height:54px;padding:10px;border-radius:16px;border:2px dashed var(--trait);align-content:flex-start}
.rang.reserve{border-style:solid;border-color:transparent;background:var(--prune)}
.jeton{background:var(--prune-2);border:2px solid var(--trait);border-radius:12px;padding:8px 13px;font-weight:700}
.rang.rep .jeton{background:var(--lilas);color:var(--nuit);border-color:var(--lilas)}
.rang.rep .jeton.bon{background:var(--ok);border-color:var(--ok)}
.rang.rep .jeton.mal{background:var(--non);border-color:var(--non)}
.erreurs{display:flex;flex-direction:column;gap:10px;margin:6px 0}
.erreurs h3{font-family:var(--titre);font-size:1.05rem;margin:4px 0 0;color:var(--ambre)}
.erreur{background:var(--prune);border:2px solid var(--trait);border-left:6px solid var(--non);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.erreur p{margin:0}
.erreur .corrige{font-family:var(--titre);font-weight:800;font-size:1.2rem}
.erreur .corrige b{color:var(--ok)}
.erreur .tienne{color:var(--sourdine);font-size:.95rem}
.erreur .tienne s{color:var(--non)}
.erreur .duo{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.erreur .duo p{border-radius:12px;padding:8px 10px;display:flex;flex-direction:column;gap:2px;font-size:1.15rem;font-family:var(--titre)}
.erreur .duo .oui{background:rgba(110,200,140,.16);border:2px solid var(--ok)}
.erreur .duo .non{background:rgba(230,100,100,.14);border:2px solid var(--non)}
.erreur .duo .vs{font-family:var(--texte);font-size:.75rem;font-weight:600;color:var(--sourdine)}
.erreur .duo b{color:var(--ok)}
.erreur .duo s{color:var(--non)}
.erreur .trad p{margin:0 0 4px}
.retour .corps{display:flex;flex-direction:column;gap:8px;min-width:0;flex:1}
.erreur .expl{font-size:.97rem;line-height:1.4}
.secoue{animation:secoue .35s}
@keyframes secoue{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.ecoute{display:flex;gap:10px;flex-wrap:wrap}
.ecoute .btn{flex:1 1 180px}
.options{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.options.longues{grid-template-columns:1fr}
.options .choix{text-align:center;font-family:var(--titre);font-weight:800;font-size:1.15rem;font-variant-numeric:tabular-nums;padding:14px 6px}
.phrase{font-family:var(--titre);font-weight:800;font-size:1.5rem;text-align:center;margin:8px 0;text-wrap:balance}
.phrase u{text-decoration:none;display:inline-block;min-width:3.2em;border-bottom:4px solid var(--ambre);color:var(--ambre)}
.chrono{height:10px;border-radius:99px;background:var(--prune);overflow:hidden}
.chrono i{display:block;height:100%;width:100%;background:var(--ambre);transform-origin:left}
.serie{text-align:center;color:var(--sourdine);font-variant-numeric:tabular-nums;margin:0}
.serie b{color:var(--ambre)}
.etoiles{font-family:var(--titre);font-weight:800;font-size:2.4rem;text-align:center;color:var(--ambre);letter-spacing:.12em;margin:0}
.etoiles s{text-decoration:none;color:var(--trait)}

/* Cartes */
.voile{position:fixed;inset:0;background:#120c19e6;display:flex;justify-content:center;z-index:20;overflow:auto;
  padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.album{max-width:480px;width:100%;display:flex;flex-direction:column;gap:14px}
.album h2{font-family:var(--titre);font-weight:800;margin:0;font-size:1.6rem}
.grille{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.carte .ci{display:block;font-style:normal;font-size:2.6rem;line-height:1.2;margin-bottom:4px}
.carte .cc{width:42px;height:42px;border-radius:12px;border:2px solid var(--creme)}
.carte .ci u,.gi u{text-decoration:none;display:inline-grid;place-items:center;width:1.1rem;height:1.5rem;font-size:.7rem;border:1px solid var(--trait);border-radius:4px;margin-right:2px;font-family:var(--titre);color:var(--sourdine)}
.carte .ci u.on,.gi u.on{background:var(--ambre);color:var(--nuit);border-color:var(--ambre)}
.grand-boite{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.grand-img{background:radial-gradient(circle at 50% 45%,var(--prune-2),var(--prune) 70%);border:3px solid var(--prune-2);border-radius:32px;width:100%;padding:22px 8px;display:grid;place-items:center}
.gi{font-style:normal;font-size:11rem;line-height:1.1;animation:pop .35s ease-out}
.gi.cc{width:190px;height:190px;border-radius:36px;border:5px solid var(--creme);font-size:0}
.gi u{width:2.4rem;height:3.4rem;font-size:1.2rem;margin-right:4px}
.grand-mot{font-family:var(--titre);font-weight:800;font-size:2.2rem;color:var(--ambre);margin:0}
.grand-sens{font-size:1.3rem;margin:0}
.carte{background:var(--prune);border-radius:14px 14px 14px 4px;padding:12px;min-width:0;border:2px solid var(--trait)}
.carte.vide{border-style:dashed;color:var(--trait);display:grid;place-items:center;min-height:72px;background:none;font-family:var(--titre);font-size:1.4rem}
.carte b{display:block;color:var(--ambre);overflow-wrap:anywhere}
.carte span{overflow-wrap:anywhere}
.bilan{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.bilan li{background:var(--prune);border-radius:12px;padding:10px 14px}
.sous{display:block;font-family:var(--texte);font-weight:400;font-size:.88rem;color:var(--sourdine);letter-spacing:0;text-transform:none}
.btn .sous{color:inherit;opacity:.75}
.onglets{display:flex;flex-wrap:wrap;gap:5px;background:var(--prune);border-radius:16px;padding:5px}
.onglet{flex:1 1 auto;min-width:0;border:0;background:none;border-radius:12px;padding:10px 4px;font-family:var(--titre);font-weight:800;font-size:.82rem;line-height:1.15;color:var(--sourdine)}
.onglet[aria-selected="true"]{background:var(--lilas);color:var(--nuit)}
.onglet-lien{flex:1 1 auto;min-width:0;display:flex;align-items:center;justify-content:center;text-align:center;text-decoration:none;border-radius:12px;padding:10px 4px;font-family:var(--titre);font-weight:800;font-size:.82rem;line-height:1.15;background:var(--ambre);color:var(--nuit)}
.onglet-lien:focus-visible{outline:3px solid var(--creme);outline-offset:2px}
.paquet .point{display:block;font-weight:400;font-size:.78rem;color:var(--lilas);overflow-wrap:anywhere}
.fiches{display:flex;flex-direction:column;gap:8px}
.titre-fiche{font-size:clamp(1.6rem,7vw,2.1rem)}
.consigne{margin:0;color:var(--sourdine);font-size:.95rem}
.fiche-titre{font-family:var(--titre);font-weight:800;font-size:1.5rem;line-height:1.15;margin:0;text-align:center;text-wrap:balance}
.fiche{margin:0;font-size:1.12rem;line-height:1.6;background:var(--prune);border-radius:6px 22px 22px 22px;padding:16px 18px}
button.carte{text-align:left;font:inherit;color:inherit}
.paquets{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.paquet{background:var(--prune-2);border:2px solid var(--trait);border-radius:14px;padding:10px 12px;text-align:left;min-width:0;font-weight:700}
.paquet .sous{overflow-wrap:anywhere}
.paquet .score{display:block;color:var(--ambre);font-size:.9rem}
.paquet .score s{text-decoration:none;color:var(--trait)}
.visuel{font-size:7.5rem;line-height:1.1;padding:18px 8px 10px;border-radius:28px;border:3px solid var(--prune-2);background:radial-gradient(circle at 50% 45%,var(--prune-2),var(--prune) 70%);animation:pop .35s ease-out;text-align:center;font-family:var(--titre);font-weight:800;color:var(--ambre)}
.pastille-couleur{width:170px;height:170px;border-radius:26px;border:4px solid var(--creme);margin:0 auto}
.mot-fr{font-family:var(--titre);font-weight:800;font-size:2.2rem;text-align:center;margin:0;line-height:1.1;text-wrap:balance}
.sens{text-align:center;font-size:1.3rem;margin:0;color:var(--lilas)}
.options.illus .choix{font-family:var(--texte);font-size:.95rem;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0;overflow-wrap:anywhere}
.mini{font-size:3.2rem;line-height:1.1;font-family:var(--titre);font-weight:800;color:var(--ambre)}
.image.grande{border-radius:26px;margin:4px 0 8px}
.bob{animation:bob 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.grande.bravo .bob{animation:saut .6s ease-out 2}
.visuel .etoiles{display:block;font-size:1.3rem;letter-spacing:2px;line-height:1.3;color:var(--ambre);font-family:var(--texte)}
.choix .emo{font-size:1.5rem;display:block;line-height:1.2}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes saut{0%,100%{transform:translateY(0) scale(1)}40%{transform:translateY(-14px) scale(1.12)}}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.bob,.grande.bravo .bob,.visuel{animation:none}}
.semaine{display:flex;gap:6px;justify-content:center}

.semaine .actif{background:var(--ambre);border-color:var(--ambre);color:var(--nuit)}
.semaine.petit{gap:2px}
.semaine.petit span{width:12px;height:20px;font-size:.55rem;border-width:1px;border-radius:4px}
.mini-couleur{width:60px;height:60px;border-radius:10px;border:2px solid var(--creme)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* Coffre, mini-jeux, suivi */
.cadenas{display:flex;gap:6px;flex-wrap:wrap;font-size:1.5rem;margin:2px 0}
.grille-cadenas{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cadenas-bouton{background:var(--prune);border:2px solid var(--trait);border-radius:14px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:800}
.cadenas-bouton .ico{font-size:1.25rem;font-family:var(--titre);min-height:1.6em;display:flex;align-items:center;text-align:center;line-height:1.1}
.cadenas-bouton small{font-size:.7rem;color:var(--sourdine);font-weight:400}
.cadenas-bouton.ouvert{border-color:var(--ok);background:rgba(110,200,140,.14)}

p2:{en:"Here you'll learn French by living a story. Tap an underlined word to see its translation.",

 tr:"Burada bir hikâye yaşayarak Fransızca öğreneceksin. Çevirisini görmek için altı çizili bir kelimeye dokun.",

 ps:"دلته به تاسو د یوې کیسې په ترڅ کې فرانسوي زده کړئ. د ژباړې لیدو لپاره په لاندې کرښه شوې کلمه ګوته کېږدئ.",

 az:"Burada bir hekayə yaşayaraq fransız dilini öyrənəcəksən. Tərcüməsini görmək üçün altından xətt çəkilmiş sözə toxun.",

 bn:"এখানে তুমি একটি গল্পের মধ্য দিয়ে ফরাসি শিখবে। অনুবাদ দেখতে নিচে দাগ দেওয়া শব্দে স্পর্শ করো।",
 ru:"Здесь ты будешь учить французский, проживая историю. Коснись подчёркнутого слова, чтобы увидеть перевод."},
p3:{en:"The “Traduire” button translates the whole sentence. But careful: the further you go, the less help there is!",
 es:"El botón «Traduire» traduce toda la frase. Pero cuidado: cuanto más avanzas, ¡menos ayuda hay!",
 pt:"O botão «Traduire» traduz a frase inteira. Mas atenção: quanto mais avanças, menos ajuda há!",
 ar:"زر «Traduire» يترجم الجملة كلها. لكن انتبه: كلما تقدّمت، قلّت المساعدة!",
 tr:"«Traduire» düğmesi tüm cümleyi çevirir. Ama dikkat: ilerledikçe yardım azalır!",
 uk:"Кнопка «Traduire» перекладає все речення. Але увага: що далі, то менше допомоги!",
 ro:"Butonul «Traduire» traduce toată propoziția. Dar atenție: cu cât avansezi, cu atât ai mai puțin ajutor!",
 fa:"دکمهٔ «Traduire» تمام جمله را ترجمه می‌کند. اما توجه: هرچه پیش بروید، کمک کمتر می‌شود!",
 zh:"“Traduire”按钮可以翻译整句话。不过注意：越往后，帮助越少！",
 ur:"«Traduire» کا بٹن پورے جملے کا ترجمہ کرتا ہے۔ لیکن دھیان رہے: جتنا آگے بڑھیں گے، مدد اتنی کم ہوگی!",
 ps:"د «Traduire» تڼۍ ټوله جمله ژباړي. خو پام کوئ: څومره چې مخکې ځئ، مرسته کمېږي!",
 pa:"«Traduire» ਬਟਨ ਪੂਰੇ ਵਾਕ ਦਾ ਅਨੁਵਾਦ ਕਰਦਾ ਹੈ। ਪਰ ਧਿਆਨ ਰੱਖੋ: ਜਿੰਨਾ ਅੱਗੇ ਵਧੋਗੇ, ਮਦਦ ਓਨੀ ਘੱਟ ਹੋਵੇਗੀ!",
 az:"«Traduire» düyməsi bütün cümləni tərcümə edir. Amma diqqət: irəlilədikcə kömək azalır!",
 hi:"«Traduire» बटन पूरे वाक्य का अनुवाद करता है। लेकिन ध्यान रहे: जितना आगे बढ़ेंगे, मदद उतनी कम होगी!",
 bn:"«Traduire» বোতাম পুরো বাক্যের অনুবাদ করে। তবে সাবধান: যত এগোবে, সাহায্য তত কমবে!",
 ru:"Кнопка «Traduire» переводит всё предложение. Но внимание: чем дальше, тем меньше помощи!"},
p4:{en:"The “Écouter” button lets you listen to the sentence. Shall we? Your first day begins!",

 ar:"زر «Écouter» يجعلك تستمع إلى الجملة. هيا بنا؟ يومك الأول يبدأ!",
 tr:"«Écouter» düğmesi cümleyi dinlemeni sağlar. Hazır mısın? İlk günün başlıyor!",

 ro:"Butonul «Écouter» te lasă să asculți propoziția. Mergem? Prima ta zi începe!",
 fa:"دکمهٔ «Écouter» جمله را برای شما می‌خواند. برویم؟ روز اول شما شروع می‌شود!",
 zh:"“Écouter”按钮可以让你听这句话。出发吧？你的第一天开始了！",
 ur:"«Écouter» کا بٹن آپ کو جملہ سناتا ہے۔ چلیں؟ آپ کا پہلا دن شروع ہوتا ہے!",
 ps:"د «Écouter» تڼۍ جمله درته اوروي. ځو؟ ستاسو لومړۍ ورځ پیلېږي!",
 pa:"«Écouter» ਬਟਨ ਤੁਹਾਨੂੰ ਵਾਕ ਸੁਣਾਉਂਦਾ ਹੈ। ਚੱਲੀਏ? ਤੁਹਾਡਾ ਪਹਿਲਾ ਦਿਨ ਸ਼ੁਰੂ ਹੁੰਦਾ ਹੈ!",
 az:"«Écouter» düyməsi cümləni dinləməyə imkan verir. Gedək? İlk günün başlayır!",
 hi:"«Écouter» बटन आपको वाक्य सुनाता है। चलें? आपका पहला दिन शुरू होता है!",
 bn:"«Écouter» বোতাম তোমাকে বাক্যটি শোনায়। চলো? তোমার প্রথম দিন শুরু হচ্ছে!",

s1:{en:"Hi! Is it your first day? I'm Sami.",es:"¡Hola! ¿Es tu primer día? Yo soy Sami.",pt:"Olá! É o teu primeiro dia? Eu sou o Sami.",
 ar:"مرحبًا! هل هذا يومك الأول؟ أنا سامي.",tr:"Selam! İlk günün mü? Ben Sami.",uk:"Привіт! Це твій перший день? А я Самі.",
 ro:"Salut! E prima ta zi? Eu sunt Sami.",fa:"سلام! روز اول تو است؟ من سامی هستم.",zh:"嗨！今天是你的第一天吗？我叫萨米。",
 ur:"سلام! کیا یہ تمہارا پہلا دن ہے؟ میں سامی ہوں۔",ps:"سلام! دا ستا لومړۍ ورځ ده؟ زه سامي یم.",pa:"ਹੈਲੋ! ਕੀ ਇਹ ਤੇਰਾ ਪਹਿਲਾ ਦਿਨ ਹੈ? ਮੈਂ ਸਾਮੀ ਹਾਂ।",
 az:"Salam! Bu sənin ilk günündür? Mən Samiyəm.",hi:"हाय! क्या यह तुम्हारा पहला दिन है? मैं सामी हूँ।",bn:"হাই! এটা কি তোমার প্রথম দিন? আমি সামি।",ru:"Привет! Это твой первый день? А я Сами."},
o1:{en:"Put the words back in order to answer Sami.",es:"Ordena las palabras para responder a Sami.",pt:"Põe as palavras na ordem certa para responder ao Sami.",
 ar:"رتّب الكلمات لتجيب سامي.",tr:"Sami'ye cevap vermek için kelimeleri sıraya koy.",uk:"Розстав слова по порядку, щоб відповісти Самі.",
 ro:"Pune cuvintele în ordine ca să-i răspunzi lui Sami.",fa:"کلمه‌ها را به ترتیب بگذارید تا به سامی جواب بدهید.",zh:"把词语排好顺序，回答萨米。",
 ur:"سامی کو جواب دینے کے لیے الفاظ کو ترتیب میں رکھیں۔",ps:"سامي ته د ځواب ورکولو لپاره کلمې په ترتیب کېږدئ.",pa:"ਸਾਮੀ ਨੂੰ ਜਵਾਬ ਦੇਣ ਲਈ ਸ਼ਬਦਾਂ ਨੂੰ ਸਹੀ ਤਰਤੀਬ ਵਿੱਚ ਰੱਖੋ।",
 az:"Samiyə cavab vermək üçün sözləri sıraya düz.",hi:"सामी को जवाब देने के लिए शब्दों को सही क्रम में रखें।",bn:"সামিকে উত্তর দিতে শব্দগুলো সঠিক ক্রমে সাজাও।",ru:"Расставь слова по порядку, чтобы ответить Сами."},
l1:{en:"Listen carefully to the voice. Which locker number do you hear?",es:"Escucha bien la voz. ¿Qué número de taquilla oyes?",
 pt:"Ouve bem a voz. Que número de cacifo ouves?",ar:"استمع جيدًا إلى الصوت. ما رقم الخزانة الذي تسمعه؟",
 tr:"Sesi iyi dinle. Hangi dolap numarasını duyuyorsun?",uk:"Уважно послухай голос. Який номер шафки ти чуєш?",
 ro:"Ascultă bine vocea. Ce număr de dulap auzi?",fa:"به صدا خوب گوش بدهید. کدام شمارهٔ الماری را می‌شنوید؟",zh:"仔细听这个声音。你听到的储物柜号码是多少？",
 ur:"آواز غور سے سنیں۔ آپ کو کون سا لاکر نمبر سنائی دیتا ہے؟",ps:"غږ ته ښه غوږ ونیسئ. د کومې المارۍ شمېره اورئ؟",pa:"ਆਵਾਜ਼ ਧਿਆਨ ਨਾਲ ਸੁਣੋ। ਤੁਹਾਨੂੰ ਕਿਹੜਾ ਲਾਕਰ ਨੰਬਰ ਸੁਣਦਾ ਹੈ?",
 az:"Səsi diqqətlə dinlə. Hansı şkaf nömrəsini eşidirsən?",hi:"आवाज़ ध्यान से सुनें। आपको कौन सा लॉकर नंबर सुनाई देता है?",bn:"কণ্ঠটি মন দিয়ে শোনো। কোন লকার নম্বর শুনতে পাচ্ছ?",ru:"Внимательно послушай голос. Какой номер шкафчика ты слышишь?"},
r1:{en:"Before noon, a little practice! The verbs “être” (to be) and “avoir” (to have) are everywhere in French. Answer fast, in rhythm!",
 es:"Antes del mediodía, ¡un poco de práctica! Los verbos «être» (ser/estar) y «avoir» (tener) están por todas partes. ¡Responde rápido, al ritmo!",
 pt:"Antes do meio-dia, um pouco de treino! Os verbos «être» (ser/estar) e «avoir» (ter) estão em todo o lado. Responde depressa, ao ritmo!",
 ar:"قبل الظهر، قليل من التدريب! الفعلان «être» (يكون) و«avoir» (يملك) موجودان في كل مكان في الفرنسية. أجب بسرعة، على الإيقاع!",
 tr:"Öğlenden önce biraz alıştırma! «être» (olmak) ve «avoir» (sahip olmak) fiilleri Fransızcada her yerde. Hızlı cevap ver, ritme uy!",
 uk:"До полудня — трохи тренування! Дієслова «être» (бути) та «avoir» (мати) у французькій всюди. Відповідай швидко, у ритмі!",
 ro:"Înainte de amiază, puțin antrenament! Verbele «être» (a fi) și «avoir» (a avea) sunt peste tot în franceză. Răspunde repede, în ritm!",
 fa:"پیش از چاشت، کمی تمرین! فعل‌های «être» (بودن) و «avoir» (داشتن) در فرانسوی همه‌جا هستند. زود جواب بدهید، با ریتم!",
 zh:"中午之前，先练习一下！动词“être”（是）和“avoir”（有）在法语里无处不在。跟着节奏，快速回答！",
 ur:"دوپہر سے پہلے تھوڑی مشق! فعل «être» (ہونا) اور «avoir» (رکھنا) فرانسیسی میں ہر جگہ ہیں۔ جلدی جواب دیں، تال کے ساتھ!",
 ps:"له غرمې مخکې لږ تمرین! د «être» (کېدل) او «avoir» (لرل) فعلونه په فرانسوي کې هر ځای دي. ژر ځواب ورکړئ، له ریتم سره!",
 pa:"ਦੁਪਹਿਰ ਤੋਂ ਪਹਿਲਾਂ ਥੋੜ੍ਹਾ ਅਭਿਆਸ! ਕਿਰਿਆਵਾਂ «être» (ਹੋਣਾ) ਅਤੇ «avoir» (ਕੋਲ ਹੋਣਾ) ਫ਼ਰਾਂਸੀਸੀ ਵਿੱਚ ਹਰ ਥਾਂ ਹਨ। ਤਾਲ ਨਾਲ, ਜਲਦੀ ਜਵਾਬ ਦਿਓ!",
 az:"Günortadan əvvəl bir az məşq! «être» (olmaq) və «avoir» (malik olmaq) felləri fransız dilində hər yerdədir. Tez cavab ver, ritmlə!",
 hi:"दोपहर से पहले थोड़ा अभ्यास! क्रियाएँ «être» (होना) और «avoir» (पास होना) फ़्रेंच में हर जगह हैं। ताल के साथ, जल्दी जवाब दें!",
 bn:"দুপুরের আগে একটু অনুশীলন! «être» (হওয়া) ও «avoir» (থাকা) ক্রিয়া ফরাসিতে সব জায়গায় আছে। তালে তালে দ্রুত উত্তর দাও!",
 ru:"До полудня — немного тренировки! Глаголы «être» (быть) и «avoir» (иметь) во французском повсюду. Отвечай быстро, в ритме!"}

function dessin(k){

  const e=el("div","image");e.innerHTML=`<svg viewBox="0 0 320 180" role="img" aria-label="${d[0]}">${d[1]}</svg>`;return e;
}
// Petit schéma pour les mots de lieu : une boîte lilas et une balle ambre.
function picto(k){
  const bo=(x,y,w,h)=>R(x,y,w,h,"#b99de3",5),ba=(x,y)=>C(x,y,11,"#f3a85c");
  const f={sur:bo(40,44,44,30)+ba(62,31),sous:bo(40,10,44,30)+ba(62,58),dans:bo(32,18,60,50)+ba(62,48),
    derriere:ba(86,36)+bo(40,34,44,36),acote:bo(30,36,44,34)+ba(92,58)}[k];
  const e=el("div","picto");e.innerHTML=`<svg viewBox="0 0 124 84" role="img" aria-label="Schéma : où est la balle par rapport à la boîte ?">${f}</svg>`;return e;
}

// Une ligne est un texte français ou {k:clé, v:{a,b}} ; une valeur « @clé » est elle-même un modèle.
function ligne(m,traduit){
  if(typeof m==="string")return m;
  const t=traduit?ui(m.k):FR[m.k];if(!t)return "";
  return t.replace(/\{(\w)\}/g,(_,x)=>{let v=m.v&&m.v[x];if(v==null)return "";
    return String(v).startsWith("@")?(traduit?ui(v.slice(1)):FR[v.slice(1)])||"":v});
}
// Bouton « Traduire » : montre les lignes traduites dans la langue du joueur.
function boutonTraduire(lignes,pre){
  if(!lignes.some(m=>typeof m!=="string"&&ui(m.k)))return null;
  const o=el("div","outils"),b=el("button","outil","Traduire"),tr=el("div","trad");
  tr.hidden=true;tr.lang=etat.langue;if(RTL[etat.langue])tr.dir="rtl";
  tr.innerHTML=(pre||[]).concat(lignes.map(m=>typeof m==="string"?"":ligne(m,true))).filter(Boolean).map(x=>`<p>${esc(x)}</p>`).join("");
  b.onclick=()=>{tr.hidden=!tr.hidden;b.setAttribute("aria-expanded",!tr.hidden)};
  b.setAttribute("aria-expanded","false");o.append(b);
  return [o,tr];
}

// Indices pour se corriger : on compare l'essai à la bonne phrase (niveau A1, phrases courtes).
const PRONOMS=["je","tu","il","elle","on","nous","vous","ils","elles"];
function indicesOrdre(mots,essai,echecs){
  const l=[];let bien=0;
  while(bien<mots.length&&essai[bien]===mots[bien])bien++;
  const maj=m=>/^[A-ZÀÂÉÈÊÎÔÛÇ]/.test(m);
  if(essai[0]!==mots[0]){
    if(!maj(essai[0]))l.push({k:"h_maj"});
    else l.push({k:"h_first"});
  }
  const fin=mots[mots.length-1].slice(-1);
  if(essai[essai.length-1]!==mots[mots.length-1]&&/[.?!]/.test(fin))
    l.push({k:"h_end",v:{a:"« "+fin+" »"}});
  // Le sujet vient juste avant le verbe.
  for(let i=0;i<mots.length-1;i++){
    const s=mots[i].toLowerCase().replace(/[,.]/g,"");
    if(PRONOMS.includes(s)&&essai.indexOf(mots[i])+1!==essai.indexOf(mots[i+1])){
      l.push({k:"h_subj",v:{a:mots[i],b:mots[i+1].replace(/[,.]/g,"")}});break;
    }
  }
  if(bien>0&&bien<mots.length)l.push({k:"h_ok",v:{a:bien}});
  return l.slice(0,3);
}

    opts.append(b);
  });
  a.append(opts,zone);
}
// Explication d'une erreur au rythme (niveau A1) : question, lieu ou verbe conjugué.
const QUESTIONS={"Où":"un lieu","Qui":"une personne","Quand":"un moment"};
const LIEUX={"sur":"au-dessus","sous":"en dessous","dans":"à l'intérieur","derrière":"à l'arrière","à côté du":"tout près, à côté","dans le":"à l'intérieur","sur le":"au-dessus"};
const FORMES=Object.assign({},window.FORMES_PLUS,{suis:"je",es:"tu",est:"il, elle",sommes:"nous",êtes:"vous",sont:"ils, elles",ai:"je (j')",as:"tu",a:"il, elle",avons:"nous",avez:"vous",ont:"ils, elles"});
function personnes(v){
  if(FORMES[v])return FORMES[v];
  if(/ent$/.test(v))return "ils, elles";
  if(/ons$/.test(v))return "nous";
  if(/ez$/.test(v))return "vous";
  if(/es$/.test(v))return "tu";
  if(/s$/.test(v))return "je, tu";
  if(/[td]$/.test(v))return "il, elle";
  return "je, il, elle";
}
function personneDe(avant){
  const a=avant.trim().toLowerCase();
  if(/^(je|j')/.test(a))return "je";if(/^tu/.test(a))return "tu";if(/^nous/.test(a))return "nous";if(/^vous/.test(a))return "vous";
  if(/^(ils|elles|les )/.test(a))return "ils, elles";return "il, elle";
}
// Pronom du sujet affiché : « Le cours » → il, « J' » → j'.
function pronomDe(avant){
  const a=avant.trim().toLowerCase();
  if(/^j'?$/.test(a)||a==="je")return "je";
  for(const p of ["tu","il","elle","nous","vous","ils","elles"])if(a===p)return p;
  return /^les /.test(a)?"ils":"il";
}
const voyelle=v=>/^[aeiouyàâéèêëîïôûh]/i.test(v);
const avecPronom=(p,v)=>p==="je"&&voyelle(v)?"j'"+v:p+" "+v;
// Carte d'erreur : bonne réponse (pronom + verbe) face à l'erreur (pronom + verbe), puis la règle.
function carteErreur(it,choisi){
  const [avant,apres,ok,,pic]=it,c=el("div","erreur");
  const lignes=[];let bonne,faute=null,pre=null;
  if(QUESTIONS[ok]||LIEUX[ok]){
    bonne=ok;faute=choisi;
    const mot={"un lieu":"@m_lieu","une personne":"@m_pers","un moment":"@m_moment","au-dessus":"@m_dessus","en dessous":"@m_dessous","à l'intérieur":"@m_dedans","à l'arrière":"@m_derriere","tout près, à côté":"@m_pres"};
    const [tab,cle]=QUESTIONS[ok]?[QUESTIONS,"r_q"]:[LIEUX,"r_lieu"];
    lignes.push({k:cle,v:{a:ok,b:mot[tab[ok]]}});
    if(choisi!=null&&tab[choisi])lignes.push({k:cle,v:{a:choisi,b:mot[tab[choisi]]}});
    if(pic)c.append(picto(pic));
  }else{
    const pr=pronomDe(avant);
    bonne=avecPronom(pr,ok);faute=choisi==null?null:avecPronom(pr,choisi);
    lignes.push({k:"r_goes",v:{a:ok,b:personnes(ok)}});
    if(choisi!=null)lignes.push({k:"r_goes",v:{a:choisi,b:personnes(choisi)}});
    if(!FORMES[ok]){const per=personneDe(avant);
      const cle={"je":"r_je","tu":"r_tu","il, elle":"r_il","nous":"r_nous","vous":"r_vous","ils, elles":"r_ils"}[per];if(cle)lignes.push({k:cle})}
  }
  if(choisi==null)lignes.unshift({k:"r_time"});
  const duo=el("div","duo");
  duo.append(el("p","oui",`<span aria-hidden="true">✔</span> <span class="vs">${esc(FR.r_ok)}</span><b>${esc(bonne)}</b>`));
  if(faute!=null)duo.append(el("p","non",`<span aria-hidden="true">✘</span> <span class="vs">${esc(FR.r_ko)}</span><s>${esc(faute)}</s>`));
  c.append(duo);
  const fr=lignes.map(m=>ligne(m,false));
  c.append(el("p","expl",fr.map(esc).join("<br>")));
  pre=[`✔ ${ui("r_ok")} : ${bonne}`].concat(faute!=null?[`✘ ${ui("r_ko")} : ${faute}`]:[]);
  const t=boutonTraduire(lignes,pre);if(t)c.append(...t);
  return c;
}
function vueRythme(p){
  const DUREE=8000;let n=0,bons=0,serie=0,minuteur=null,arret=false;const rates=[];
  nettoyage=()=>{arret=true;clearTimeout(minuteur)};
  scene.append(el("p","jeu-titre",esc(p.titre)));
  const schema=el("div"),phrase=el("p","phrase"),chrono=el("div","chrono","<i></i>"),info=el("p","serie");
  info.setAttribute("aria-live","polite");
  scene.append(schema,phrase,chrono,info);
  const a=zoneActions(),opts=el("div","options");a.append(opts);
  if(p.items.some(it=>it[2].length>8))opts.classList.add("longues");
  function tour(){
    if(arret)return;
    if(n>=p.items.length)return bilan();
    const [avant,apres,ok,faux,pic]=p.items[n];
    schema.innerHTML="";if(pic)schema.append(picto(pic));
    phrase.innerHTML=`${esc(avant)}${!avant||avant.endsWith("'")?"":" "}<u>&nbsp;</u> ${esc(apres)}`;
    info.innerHTML=`Phrase ${n+1} sur ${p.items.length} · série <b>${serie}</b>`;
    opts.innerHTML="";
    melange([ok,...faux]).forEach(v=>{
      const b=el("button","choix",esc(v));b.onclick=()=>reponse(v===ok,b,ok);opts.append(b);
    });
    const barre=chrono.firstChild;barre.style.transition="none";barre.style.transform="scaleX(1)";void barre.offsetWidth;
    barre.style.transition=`transform ${DUREE}ms linear`;barre.style.transform="scaleX(0)";
    minuteur=setTimeout(()=>reponse(false,null,ok),DUREE);
  }
  function reponse(juste,b,ok){
    if(arret)return;
    clearTimeout(minuteur);
    chrono.firstChild.style.transition="none";
    opts.querySelectorAll("button").forEach(x=>{x.disabled=true;if(x.textContent===ok)x.classList.add("bon")});
    if(b&&!juste)b.classList.add("faux");
    phrase.querySelector("u").textContent=ok;
    if(juste){bons++;serie++}else{serie=0;rates.push({it:p.items[n],choisi:b?b.textContent:null})}
    info.innerHTML=juste?`Oui ! Série <b>${serie}</b>`:`La bonne réponse : <b>${esc(ok)}</b>`;
    n++;minuteur=setTimeout(tour,juste?800:1700);
  }
  function bilan(){
    const e=bons>=8?3:bons>=6?2:1;etoile(e);
    phrase.textContent=`${bons} bonnes réponses sur ${p.items.length}`;
    schema.remove();chrono.remove();info.remove();opts.remove();
    scene.insertBefore(el("p","etoiles","★".repeat(e)+"<s>"+"★".repeat(3-e)+"</s>"),a);
    if(rates.length){
      const bloc=el("div","erreurs");bloc.append(el("h3",null,rates.length>1?"Les réponses à corriger":"La réponse à corriger"));
      rates.forEach(({it,choisi})=>bloc.append(carteErreur(it,choisi)));
      scene.insertBefore(bloc,a);
    }
    a.append(retourProf(e===3?"Excellent rythme ! Tu réponds vite et bien.":"Bien joué ! Tu peux rejouer l'épisode pour battre ton score.",true),boutonSuite());
  }
  tour();
}
function vueFin(){
  const ep=EPISODES[etat.ep],s=partie(etat.ep);
  s.fini=true;s.meilleur=Math.max(s.meilleur||0,etat.etoiles);s.i=0;s.etoiles=0;enregistrer();
  scene.append(el("p","sur",`Épisode ${etat.ep} terminé`));
  scene.append(el("h1",null,"Bien joué, "+esc(etat.nom)+" !"));
  scene.append(el("p","etoiles",`★ ${etat.etoiles} / ${ETOILES_MAX}`));
  const ul=el("ul","bilan");
  ul.append(el("li",null,`<b>${etat.cartes.size} cartes</b> de vocabulaire sur ${Object.keys(MOTS).length}`));
  ul.append(el("li",null,esc(ep.indice)),el("li",null,esc(ep.suite)));
  scene.append(ul);
  const a=zoneActions();
  if(EPISODES[etat.ep+1]){const n=el("button","btn",`Jouer l'épisode ${etat.ep+1}`);n.onclick=()=>lancer(etat.ep+1,true);a.append(n)}
  const m=el("button","btn doux","Retour au menu");m.onclick=()=>menu(false);a.append(m);
}

/* ---------- Cartes ---------- */
function imageCarte(k,cls){
  const m=IMG.pourMot(k,MOTS[k][0]);
  if(m.type==="couleur")return `<i class="${cls} cc" style="background:${m.v}"></i>`;
  if(m.type==="jour")return `<i class="${cls}">${["L","M","M","J","V","S","D"].map((l,i)=>`<u${i===m.v?' class="on"':""}>${l}</u>`).join("")}</i>`;
  return `<i class="${cls}">${m.v}</i>`;
}
// Image en grand : on touche l'image pour réentendre le mot en français.
function agrandir(k){
  const v=$("#grand");v.innerHTML="";
  const f=MOTS[k][0];
  const im=el("button","grand-img",imageCarte(k,"gi"));im.setAttribute("aria-label","Écouter "+f);im.onclick=()=>parler(f);
  const t=el("p","grand-mot",esc(f)),s=el("p","grand-sens",esc(traduction(k)));s.lang=etat.langue;if(RTL[etat.langue])s.dir="rtl";
  const e=el("button","btn","Écouter"),x=el("button","btn doux","Fermer");
  e.onclick=()=>parler(f);x.onclick=()=>{silence();v.hidden=true;$("#grille button.carte")&&0};
  const boite=el("div","album grand-boite");boite.append(im,t,s,e,x);v.append(boite);
  v.hidden=false;x.focus();parler(f);
}
$("#grand").onclick=e=>{if(e.target.id==="grand"){silence();e.target.hidden=true}};
function ouvreCartes(){
  const g=$("#grille");g.innerHTML="";
  Object.keys(MOTS).forEach(k=>{
    if(etat.cartes.has(k)){
      const c=el("button","carte",`${imageCarte(k,"ci")}<b>${esc(MOTS[k][0])}</b><span ${attrLangue()}>${esc(traduction(k))}</span>`);
      c.setAttribute("aria-label",`${MOTS[k][0]} : agrandir et écouter`);c.onclick=()=>agrandir(k);g.append(c);
    }

  });
  $("#voile").hidden=false;$("#ferme-cartes").focus();
}
$("#ouvre-cartes").onclick=ouvreCartes;
$("#menu-cartes").onclick=ouvreCartes;
$("#ferme-cartes").onclick=()=>{$("#voile").hidden=true};
function majVoix(){const b=$("#voix");b.setAttribute("aria-pressed",etat.voix);b.textContent=etat.voix?"Voix":"Voix coupée"}
$("#voix").onclick=()=>{etat.voix=!etat.voix;majVoix();enregistrer();if(!etat.voix)silence()};

/* ---------- Menu principal ---------- */
function listeEpisodes(){
  const z=$("#episodes");z.innerHTML="";
  const tete=el("div");tete.append(el("p","sur","L'histoire"));
  const sous=el("p","pitch",esc(ui("menu_histoire")));sous.lang=etat.langue;if(RTL[etat.langue])sous.dir="rtl";tete.append(sous);z.append(tete);
  if(window.listeBases)listeBases();
  Object.keys(EPISODES).forEach(k=>{
    const n=+k,ep=EPISODES[n],s=sauve.eps[n]||{},enCours=s.i>0;
    const c=el("div","episode");
    c.append(el("p","sur",`Épisode ${n}`),el("h2",null,esc(ep.titre)),el("p",null,esc(ep.resume)));
    const bouts=[];
    if(enCours)bouts.push(`En cours · <b>${Math.round(s.i/(ep.etapes.length-1)*100)} %</b>`);
    if(s.fini)bouts.push(`Terminé · <b>★ ${s.meilleur} / ${ETOILES_MAX}</b>`);
    if(bouts.length)c.append(el("p","statut",bouts.join(" · ")));
    const b=el("button","btn",enCours?"Reprendre":s.fini?"Rejouer":"Commencer");
    b.onclick=()=>lancer(n,!enCours);c.append(b);
    if(enCours){const r=el("button","btn doux","Recommencer au début");r.onclick=()=>lancer(n,true);c.append(r)}
    z.append(c);
  });
  if(window.carteCoffre)carteCoffre(z);
  if(window.listeJeux)listeJeux();

function menu(sauvegarde){
  quitteEtape();enregistrer();listeEpisodes();
  $("#note").hidden=!sauvegarde;
  $("#accueil").hidden=false;$("#haut").hidden=true;scene.hidden=true;scene.innerHTML="";window.scrollTo(0,0);

function lancer(n,debut){
  quitteEtape();
  etat.nom=$("#prenom").value.trim()||"Alex";etat.ep=n;
  const s=partie(n);if(debut){s.i=0;s.etoiles=0}
  etat.i=s.i;etat.etoiles=s.etoiles;etat.img=null;
  // En reprise, on retrouve le lieu de l'étape sauvegardée.
  for(let j=0;j<etat.i;j++){const p=etapes()[j];if(p.t==="lieu")poseLieu(p)}
  $("#accueil").hidden=true;$("#haut").hidden=false;scene.hidden=false;majVoix();
  afficher();
}
$("#vers-menu").onclick=()=>menu(true);
$("#prenom").value=etat.nom;
$("#prenom").addEventListener("input",e=>{etat.nom=e.target.value.trim();enregistrer()});
// Choix de la langue : une liste déroulante avec le drapeau du pays.
const DRAPEAUX={en:"🇬🇧",es:"🇪🇸",pt:"🇵🇹",ar:"🇸🇦",tr:"🇹🇷",uk:"🇺🇦",ro:"🇷🇴",fa:"🇦🇫",zh:"🇨🇳",ur:"🇵🇰",ps:"🇦🇫",pa:"🇮🇳",az:"🇦🇿",hi:"🇮🇳",bn:"🇧🇩",ru:"🇷🇺"};
(function(){
  const zone=$("#langues"),bt=el("button","langue-bouton"),liste=el("ul","langue-liste");
  bt.type="button";bt.setAttribute("aria-haspopup","listbox");bt.setAttribute("aria-expanded","false");bt.setAttribute("aria-labelledby","etq-langue");
  liste.setAttribute("role","listbox");liste.setAttribute("aria-labelledby","etq-langue");liste.hidden=true;
  function maj(){
    const nom=LANGUES.find(x=>x[0]===etat.langue)[1];
    bt.innerHTML=`<span class="fl" aria-hidden="true">${DRAPEAUX[etat.langue]}</span><span class="nom" lang="${etat.langue}">${esc(nom)}</span><span class="fleche" aria-hidden="true">▾</span>`;
    liste.querySelectorAll(".langue").forEach(x=>x.setAttribute("aria-selected",x.dataset.code===etat.langue));
  }
  function ferme(rendre){liste.hidden=true;bt.setAttribute("aria-expanded","false");if(rendre)bt.focus()}
  function ouvre(){liste.hidden=false;bt.setAttribute("aria-expanded","true");const c=liste.querySelector('[aria-selected="true"]');if(c){c.scrollIntoView({block:"nearest"});c.focus()}}
  LANGUES.forEach(([code,nom])=>{
    const li=el("li");li.setAttribute("role","presentation");
    const b=el("button","langue",`<span class="fl" aria-hidden="true">${DRAPEAUX[code]}</span><span lang="${code}">${esc(nom)}</span>`);
    b.type="button";b.dataset.code=code;b.setAttribute("role","option");

    li.append(b);liste.append(li);
  });
  bt.onclick=()=>liste.hidden?ouvre():ferme();
  zone.addEventListener("keydown",e=>{
    if(e.key==="Escape"&&!liste.hidden){ferme(true);return}
    if((e.key==="ArrowDown"||e.key==="ArrowUp")&&!liste.hidden){
      const bs=[...liste.querySelectorAll(".langue")],i=bs.indexOf(document.activeElement);
      e.preventDefault();bs[Math.max(0,Math.min(bs.length-1,i+(e.key==="ArrowDown"?1:-1)))].focus();
    }
  });
  document.addEventListener("click",e=>{if(!liste.hidden&&!zone.contains(e.target))ferme()});
  zone.append(bt,liste);maj();
})();
listeEpisodes();
